[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cladistica"
version = "0.1.1"
description = "Cladistica: modular cpDNA accession-to-tree phylogenetic workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.81",
  "openpyxl>=3.1",
]

[project.scripts]
cladistica = "cladistica.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cladistica*"]
