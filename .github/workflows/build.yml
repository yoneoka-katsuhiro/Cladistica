name: Native packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update package installer
        run: python -m pip install --upgrade pip
      - name: Install package and native build tools
        run: python -m pip install -c packaging/constraints-release.txt -e . "pyinstaller>=6,<7"
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and test the frozen CLI
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cladistica-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
